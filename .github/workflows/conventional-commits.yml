
name: Validar Conventional Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-commits:
    name: Validar Conventional Commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Validar título do Pull Request
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | npx commitlint --verbose

      - name: Validar commits do Push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --last --verbose
          else
            npx commitlint --from="$BEFORE" --to="$AFTER" --verbose
          fi
