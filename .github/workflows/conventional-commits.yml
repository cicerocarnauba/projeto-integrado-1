
name: Validar Conventional Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  lint-commits:
    name: Validar Mensagens de Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Instalar dependências de validação
        run: npm install --no-save --no-audit --no-fund @commitlint/cli @commitlint/config-conventional

      # Validação dos commits adicionados no Push
      - name: Validar commits do Push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "$AFTER" = "$ZERO_SHA" ]; then
            echo "Branch removida. Nenhum commit para validar."
            exit 0
          fi

          if [ "$BEFORE" = "$ZERO_SHA" ]; then
            echo "Primeiro envio da branch. Validando histórico enviado."
            COMMITS=$(git rev-list --reverse "$AFTER")
          else
            if git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
              BASE="$BEFORE"
            else
              echo "Histórico reescrito detectado. Calculando ponto de divergência."
              BASE=$(git merge-base "$BEFORE" "$AFTER")

              if [ -z "$BASE" ]; then
                echo "Não foi possível encontrar um ancestral comum."
                exit 1
              fi
            fi

            COMMITS=$(git rev-list --reverse "$AFTER" "^$BASE")
          fi

          if [ -z "$COMMITS" ]; then
            echo "Nenhum commit novo para validar."
            exit 0
          fi

          for COMMIT in $COMMITS; do
            echo "----------------------------------------"
            echo "Validando commit: $COMMIT"
            git show -s --format=%B "$COMMIT" | npx commitlint --verbose
          done

          echo "Todos os commits do Push foram validados!"

      # Validação dos commits de Pull Requests comuns
      - name: Validar commits do Pull Request
        if: github.event_name == 'pull_request' && github.base_ref != 'main' && github.base_ref != 'master'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")

          if [ -z "$BASE" ]; then
            echo "Não foi possível encontrar o ponto de divergência."
            exit 1
          fi

          COMMITS=$(git rev-list --reverse "$HEAD_SHA" "^$BASE")

          if [ -z "$COMMITS" ]; then
            echo "Nenhum commit para validar."
            exit 0
          fi

          for COMMIT in $COMMITS; do
            echo "----------------------------------------"
            echo "Validando commit: $COMMIT"
            git show -s --format=%B "$COMMIT" | npx commitlint --verbose
          done

          echo "Todos os commits do Pull Request foram validados!"

      # Validação do título de PRs destinadas à main ou master
      - name: Validar título do Pull Request (Release)
        if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | npx commitlint --verbose

          echo "Título do Pull Request validado!"
